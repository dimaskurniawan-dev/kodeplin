<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0B0715">
<title>SWAGS — Panel Pengelola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0715;
    --glass:rgba(255,255,255,.06);
    --glass-border:rgba(255,255,255,.14);
    --text:#F5F3FA;
    --text-dim:#A79FBE;
    --accent-1:#7C5CFF;
    --accent-2:#42D9FF;
    --accent-3:#FF5CB3;
    --danger:#FF6B6B;
    --ok:#5FE0A0;
    --font:'Plus Jakarta Sans', sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--text); font-family:var(--font);
    min-height:100vh; padding:40px 18px 60px; -webkit-font-smoothing:antialiased;
    position:relative; overflow-x:hidden;
  }

  .blob{ position:fixed; border-radius:50%; filter:blur(70px); z-index:0; opacity:.5; will-change:transform; }
  .blob.b1{ width:440px; height:440px; background:var(--accent-1); top:-150px; left:-130px; animation:float1 16s ease-in-out infinite; }
  .blob.b2{ width:380px; height:380px; background:var(--accent-2); bottom:-130px; right:-110px; animation:float2 19s ease-in-out infinite; }
  @keyframes float1{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(50px,40px) scale(1.1); } }
  @keyframes float2{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(-40px,-30px) scale(1.06); } }

  .wrap{ position:relative; z-index:1; width:100%; max-width:460px; margin:0 auto; }

  #gate{ min-height:65vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .gate-logo{ width:64px; height:64px; border-radius:18px; overflow:hidden; margin-bottom:16px; background:var(--glass); border:1px solid var(--glass-border); backdrop-filter:blur(16px); }
  .gate-logo img{ width:100%; height:100%; object-fit:cover; display:block; }
  #gate p{ color:var(--text-dim); font-size:13.5px; margin:0 0 20px; max-width:280px; }
  #gate input{
    width:100%; max-width:240px; padding:13px 14px; border-radius:12px;
    border:1px solid var(--glass-border); background:rgba(0,0,0,.22); color:var(--text);
    font-size:14.5px; text-align:center; margin-bottom:12px; outline:none;
  }
  #gate input:focus{ border-color:var(--accent-2); }
  #gate button{
    background:linear-gradient(135deg, var(--accent-1), var(--accent-2)); color:#0B0715; border:none; border-radius:12px;
    padding:13px 28px; font-weight:700; font-size:14px; cursor:pointer;
    box-shadow:0 14px 30px -10px rgba(124,92,255,.55);
  }
  #gateError{ color:var(--danger); font-size:13px; margin-top:10px; min-height:16px; }

  #panel{ display:none; }
  #panel.open{ display:block; }

  .panel-header{ display:flex; align-items:center; gap:12px; margin-bottom:26px; }
  .panel-header .badge{ width:38px; height:38px; border-radius:11px; overflow:hidden; background:var(--glass); border:1px solid var(--glass-border); }
  .panel-header .badge img{ width:100%; height:100%; object-fit:cover; display:block; }
  .panel-header .title{ font-size:16.5px; font-weight:700; }
  .panel-header .subtitle{ font-size:12px; color:var(--text-dim); }

  .card{
    background:var(--glass); border:1px solid var(--glass-border); border-radius:22px; padding:22px;
    backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px); margin-bottom:18px;
  }
  .card h2{ font-size:15px; font-weight:700; margin:0 0 14px; color:var(--text); }

  .code-generate{ display:flex; align-items:center; gap:10px; margin-bottom:4px; }
  #generatedCode{
    flex:1; font-weight:800; font-size:22px; letter-spacing:.12em; text-align:center;
    padding:13px; border-radius:12px; border:1px dashed var(--glass-border); background:rgba(0,0,0,.22);
    background-image:linear-gradient(135deg, var(--accent-2), var(--accent-3));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  #genBtn{
    flex-shrink:0; background:var(--text); color:#0B0715; border:none; border-radius:12px;
    padding:13px 16px; font-weight:700; font-size:13px; cursor:pointer;
  }
  .gen-note{ font-size:11.5px; color:var(--text-dim); margin-top:8px; }

  label{ font-size:11.5px; color:var(--text-dim); font-weight:600; display:block; margin-top:12px; margin-bottom:5px; }
  input[type="text"], input[type="url"]{
    width:100%; padding:11px 13px; border-radius:10px; border:1px solid var(--glass-border);
    font-family:var(--font); font-size:13px; background:rgba(0,0,0,.22); color:var(--text); outline:none;
  }
  input[type="text"]:focus, input[type="url"]:focus{ border-color:var(--accent-2); }
  #saveBtn{
    margin-top:18px; width:100%; background:linear-gradient(135deg, var(--accent-1), var(--accent-2)); color:#0B0715;
    border:none; border-radius:12px; padding:13px; font-weight:700; font-size:14px; cursor:pointer;
    box-shadow:0 14px 30px -10px rgba(124,92,255,.5);
  }
  .status{ font-size:12.5px; margin-top:10px; min-height:16px; }
  .status.ok{ color:var(--ok); }
  .status.err{ color:var(--danger); }

  .list-item{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 0; border-top:1px solid rgba(255,255,255,.08); font-size:13px; }
  .list-item:first-child{ border-top:none; }
  .list-item .code{ font-weight:800; letter-spacing:.06em; background:linear-gradient(135deg, var(--accent-2), var(--accent-3)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .list-item .name{ color:var(--text-dim); font-size:11.5px; }
  .list-item button{
    flex-shrink:0; background:none; border:1px solid var(--glass-border); color:var(--danger); border-radius:8px;
    padding:6px 11px; font-size:11.5px; cursor:pointer;
  }
  .empty{ color:var(--text-dim); font-size:13px; text-align:center; padding:8px 0; }

  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.001ms !important; } }
</style>
</head>
<body>

<div class="blob b1"></div>
<div class="blob b2"></div>

<div class="wrap">

  <div id="gate">
    <div class="gate-logo"><img src="https://files.catbox.moe/pzqllx.jpeg" alt="SWAGS"></div>
    <p>Panel ini khusus buat pengelola. Masukin kata sandi buat lanjut.</p>
    <input id="pw" type="password" placeholder="Kata sandi">
    <br>
    <button id="pwBtn">Masuk</button>
    <div id="gateError"></div>
  </div>

  <div id="panel">
    <div class="panel-header">
      <div class="badge"><img src="https://files.catbox.moe/pzqllx.jpeg" alt="SWAGS"></div>
      <div>
        <div class="title">SWAGS</div>
        <div class="subtitle">Panel Pengelola</div>
      </div>
    </div>

    <div class="card">
      <h2>Buat kode baru</h2>
      <div class="code-generate">
        <div id="generatedCode">—</div>
        <button id="genBtn">Buat Kode</button>
      </div>
      <div class="gen-note">Sistem otomatis cek semua kode yang sudah ada, biar gak ada yang sama atau kemiripan tinggi.</div>

      <label>Nama produk</label>
      <input id="f_name" type="text" placeholder="Contoh: Hoodie SWAGS Onyx">

      <label>Harga</label>
      <input id="f_price" type="text" placeholder="Contoh: 189000">

      <label>Deskripsi singkat</label>
      <input id="f_desc" type="text" placeholder="Contoh: Fleece 320gsm, unisex, size M–XL">

      <label>Tautan gambar produk</label>
      <input id="f_img" type="url" placeholder="https://...">

      <label>Tautan afiliasi Shopee</label>
      <input id="f_link" type="url" placeholder="https://shopee.co.id/...">

      <button id="saveBtn">Simpan Produk</button>
      <div class="status" id="saveStatus"></div>
    </div>

    <div class="card">
      <h2>Kode yang sudah tersimpan</h2>
      <div id="productList"></div>
    </div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Sama seperti index.html — pakai project Firebase yang sama, tapi data
// disimpan di collection "swags_products" sendiri.
const firebaseConfig = {
  apiKey: "AIzaSyDBBLtavFrkpnh15OwT9wuebWNrO-3db58",
  authDomain: "kodeplin.firebaseapp.com",
  projectId: "kodeplin",
  storageBucket: "kodeplin.firebasestorage.app",
  messagingSenderId: "80590831761",
  appId: "1:80590831761:web:7d683d9ca4bc1edafd7f30"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const COLLECTION = "swags_products";

// GANTI kata sandi ini sebelum dipakai beneran. Jangan share link
// halaman ini ke siapa pun selain kamu sendiri.
const ADMIN_PASSWORD = "020609";

const gate = document.getElementById('gate');
const panel = document.getElementById('panel');
const pwInput = document.getElementById('pw');
const gateError = document.getElementById('gateError');

document.getElementById('pwBtn').addEventListener('click', checkPassword);
pwInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') checkPassword(); });

function checkPassword(){
  if (pwInput.value === ADMIN_PASSWORD) {
    gate.style.display = 'none';
    panel.classList.add('open');
    refreshList();
  } else {
    gateError.textContent = 'Kata sandi salah. Coba lagi.';
  }
}

async function getAllProducts(){
  const products = {};
  try {
    const snap = await getDocs(collection(db, COLLECTION));
    snap.forEach(d => { products[d.id] = d.data(); });
  } catch (e) { /* belum ada produk atau koneksi bermasalah */ }
  return products;
}
async function saveProduct(code, data){ await setDoc(doc(db, COLLECTION, code), data); }
async function removeProduct(code){ await deleteDoc(doc(db, COLLECTION, code)); }

const CODE_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
function randomCode(length){
  let out = '';
  for (let i = 0; i < length; i++) out += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)];
  return out;
}
function hammingDistance(a, b){
  let d = 0;
  for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) d++;
  return d;
}
function isTooSimilar(candidate, existingCodes){
  for (const existing of existingCodes) {
    if (existing.length === candidate.length && hammingDistance(candidate, existing) <= 1) return true;
  }
  return false;
}

let currentGeneratedCode = null;

document.getElementById('genBtn').addEventListener('click', async () => {
  const genBtn = document.getElementById('genBtn');
  genBtn.textContent = 'Cek...';
  const products = await getAllProducts();
  const existingCodes = Object.keys(products);

  let candidate, attempts = 0;
  do {
    candidate = randomCode(5);
    attempts++;
  } while ((existingCodes.includes(candidate) || isTooSimilar(candidate, existingCodes)) && attempts < 200);

  currentGeneratedCode = candidate;
  document.getElementById('generatedCode').textContent = candidate;
  genBtn.textContent = 'Buat Kode';
});

document.getElementById('saveBtn').addEventListener('click', async () => {
  const statusEl = document.getElementById('saveStatus');
  const name = document.getElementById('f_name').value.trim();
  const price = document.getElementById('f_price').value.trim();
  const desc = document.getElementById('f_desc').value.trim();
  const img = document.getElementById('f_img').value.trim();
  const link = document.getElementById('f_link').value.trim();

  if (!currentGeneratedCode) {
    statusEl.textContent = 'Buat kode dulu sebelum simpan.';
    statusEl.className = 'status err';
    return;
  }
  if (!name || !link) {
    statusEl.textContent = 'Nama produk dan tautan Shopee wajib diisi.';
    statusEl.className = 'status err';
    return;
  }

  try {
    const existing = await getDoc(doc(db, COLLECTION, currentGeneratedCode));
    if (existing.exists()) {
      statusEl.textContent = 'Kode ini baru saja terpakai, buat kode baru dulu.';
      statusEl.className = 'status err';
      return;
    }
    await saveProduct(currentGeneratedCode, {
      name, price, desc,
      img: img || 'https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=300&h=300&fit=crop',
      link
    });
    statusEl.textContent = `Kode ${currentGeneratedCode} berhasil disimpan.`;
    statusEl.className = 'status ok';
    ['f_name','f_price','f_desc','f_img','f_link'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('generatedCode').textContent = '—';
    currentGeneratedCode = null;
    refreshList();
  } catch (e) {
    statusEl.textContent = 'Gagal menyimpan. Cek koneksi dan coba lagi.';
    statusEl.className = 'status err';
  }
});

async function refreshList(){
  const listEl = document.getElementById('productList');
  const products = await getAllProducts();
  const codes = Object.keys(products);
  if (codes.length === 0) {
    listEl.innerHTML = '<div class="empty">Belum ada kode yang tersimpan.</div>';
    return;
  }
  listEl.innerHTML = codes.map(code => `
    <div class="list-item">
      <div>
        <div class="code">${code}</div>
        <div class="name">${products[code].name}</div>
      </div>
      <button data-code="${code}" class="delBtn">Hapus</button>
    </div>
  `).join('');

  document.querySelectorAll('.delBtn').forEach(btn => {
    btn.addEventListener('click', async () => {
      await removeProduct(btn.getAttribute('data-code'));
      refreshList();
    });
  });
}
</script>

</body>
</html>
