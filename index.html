<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0A0A0A">
<title>SWAGS — Cek Kode Produk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0A;
    --plate:#151515;
    --plate-edge:#2A2A2A;
    --chrome-1:#EDEDED;
    --chrome-2:#9A9A9A;
    --text:#F2F2F2;
    --text-dim:#8C8C8C;
    --accent:#4FD6FF;
    --danger:#FF6B5E;
    --font-display:'Anton', sans-serif;
    --font-body:'Inter', sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ width:100%; max-width:420px; padding:56px 22px 60px; display:flex; flex-direction:column; align-items:center; }

  .logo{
    font-family:var(--font-display);
    font-size:44px;
    letter-spacing:.03em;
    background:linear-gradient(180deg, #FFFFFF 0%, #C7C7C7 45%, #7C7C7C 55%, #E8E8E8 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 1px 0 rgba(255,255,255,.15);
    margin:0 0 6px;
  }
  .tagline{ font-size:13.5px; color:var(--text-dim); margin-bottom:40px; text-align:center; line-height:1.5; }

  .plate{
    width:100%;
    background:var(--plate);
    border:1px solid var(--plate-edge);
    border-radius:10px;
    padding:26px 22px;
    position:relative;
  }
  .plate::before{
    content:'';
    position:absolute; inset:0;
    border-radius:10px;
    background:linear-gradient(135deg, rgba(255,255,255,.05), transparent 40%);
    pointer-events:none;
  }
  .rivet{ position:absolute; width:6px; height:6px; border-radius:50%; background:#3A3A3A; box-shadow:inset 0 1px 0 rgba(255,255,255,.15); }
  .rivet.tl{ top:10px; left:10px; } .rivet.tr{ top:10px; right:10px; }
  .rivet.bl{ bottom:10px; left:10px; } .rivet.br{ bottom:10px; right:10px; }

  .field-label{ font-size:11.5px; color:var(--text-dim); letter-spacing:.04em; margin-bottom:8px; }

  #codeInput{
    width:100%;
    font-family:var(--font-display);
    font-size:26px;
    letter-spacing:.22em;
    text-transform:uppercase;
    text-align:center;
    background:#0D0D0D;
    border:1px solid var(--plate-edge);
    border-radius:8px;
    padding:14px 8px;
    color:var(--text);
    outline:none;
    transition:border-color .15s ease;
  }
  #codeInput::placeholder{ color:#4A4A4A; letter-spacing:.08em; font-family:var(--font-body); font-size:14px; font-weight:500; text-transform:none; }
  #codeInput:focus{ border-color:var(--accent); }

  #searchBtn{
    width:100%;
    margin-top:14px;
    background:var(--accent);
    color:#00222B;
    border:none;
    border-radius:8px;
    padding:14px;
    font-family:var(--font-body);
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
    transition:filter .15s ease, transform .1s ease;
  }
  #searchBtn:hover{ filter:brightness(1.08); }
  #searchBtn:active{ transform:scale(.985); }
  #searchBtn:disabled{ opacity:.55; cursor:progress; }

  #resultZone{ width:100%; margin-top:18px; }
  .result-box{
    border:1px solid var(--plate-edge);
    border-radius:10px;
    padding:20px;
    background:var(--plate);
  }
  .result-box.hidden-init{ opacity:0; }

  .r-loading{ display:flex; gap:16px; align-items:flex-start; }
  .r-skel{ background:linear-gradient(90deg, #1B1B1B 25%, #262626 37%, #1B1B1B 63%); background-size:400% 100%; animation:shimmer 1.3s ease infinite; border-radius:6px; }
  @keyframes shimmer{ 0%{ background-position:100% 0; } 100%{ background-position:0 0; } }
  .r-skel.thumb{ width:88px; height:88px; flex-shrink:0; }
  .r-skel-lines{ flex:1; display:flex; flex-direction:column; gap:10px; padding-top:4px; }
  .r-skel.line{ height:11px; }
  .r-skel.line.w70{ width:70%; } .r-skel.line.w45{ width:45%; } .r-skel.line.w90{ width:90%; height:34px; margin-top:6px; }

  .r-found{ display:grid; grid-template-columns:88px 1fr; gap:16px; align-items:start; }
  .r-found img{ width:88px; height:88px; object-fit:cover; border-radius:8px; background:#0D0D0D; display:block; }
  .r-name{ font-weight:700; font-size:15.5px; line-height:1.3; margin:0 0 6px; color:var(--text); }
  .r-price{ font-family:var(--font-body); font-weight:700; font-size:14.5px; color:var(--accent); margin:0 0 8px; }
  .r-desc{ font-size:13px; color:var(--text-dim); line-height:1.5; margin:0 0 14px; }
  .r-buy{
    display:inline-flex; align-items:center; gap:7px;
    background:var(--text); color:#0A0A0A; text-decoration:none;
    font-weight:700; font-size:13.5px; padding:10px 16px; border-radius:7px;
  }
  .r-buy svg{ width:14px; height:14px; }

  .r-empty, .r-error{ text-align:center; padding:8px 4px; }
  .r-empty strong, .r-error strong{ display:block; font-size:14.5px; margin-bottom:6px; color:var(--text); }
  .r-empty span, .r-error span{ font-size:13px; color:var(--text-dim); line-height:1.5; }
  .r-error strong{ color:var(--danger); }

  .steps{ width:100%; margin-top:44px; }
  .steps li{ list-style:none; display:flex; gap:12px; padding:10px 0; border-top:1px solid var(--plate-edge); font-size:13px; color:var(--text-dim); }
  .steps li:first-child{ border-top:none; }
  .steps b{ color:var(--text); font-weight:600; }
  .steps ul{ margin:0; padding:0; }

  footer{ margin-top:auto; padding:26px 0 34px; font-size:12px; color:#5C5C5C; }

  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.001ms !important; } }
</style>
</head>
<body>

<div class="wrap">
  <h1 class="logo">SWAGS</h1>
  <p class="tagline">Lihat kode 5 digit di postingan kami? Masukin di sini buat langsung liat produknya.</p>

  <div class="plate">
    <span class="rivet tl"></span><span class="rivet tr"></span><span class="rivet bl"></span><span class="rivet br"></span>
    <div class="field-label">Kode produk</div>
    <input id="codeInput" type="text" placeholder="cth. 7XQ2M" maxlength="8" autocomplete="off">
    <button id="searchBtn">Cari Produk</button>
  </div>

  <div id="resultZone"></div>

  <ul class="steps">
    <li><span><b>1.</b> Kode ada di caption atau video postingan SWAGS.</span></li>
    <li><span><b>2.</b> Masukin kode-nya di kotak di atas.</span></li>
    <li><span><b>3.</b> Klik beli, lanjut checkout di Shopee.</span></li>
  </ul>
</div>

<footer>SWAGS</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// TODO: ganti dengan config Firebase project kamu sendiri kalau mau dipisah
// dari project lama. Kalau tetap pakai project yang sama, biarin aja —
// data disimpan di collection "swags_products" jadi gak bakal ketimpa
// sama data project sebelumnya.
const firebaseConfig = {
  apiKey: "AIzaSyDBBLtavFrkpnh15OwT9wuebWNrO-3db58",
  authDomain: "kodeplin.firebaseapp.com",
  projectId: "kodeplin",
  storageBucket: "kodeplin.firebasestorage.app",
  messagingSenderId: "80590831761",
  appId: "1:80590831761:web:7d683d9ca4bc1edafd7f30"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const COLLECTION = "swags_products";

const codeInput = document.getElementById('codeInput');
const searchBtn = document.getElementById('searchBtn');
const resultZone = document.getElementById('resultZone');

codeInput.addEventListener('input', () => {
  codeInput.value = codeInput.value.toUpperCase();
});
codeInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleSearch(); });
searchBtn.addEventListener('click', handleSearch);

function formatPrice(price){
  const trimmed = String(price).trim();
  if (!/^[\d.,]+$/.test(trimmed)) return trimmed;
  const digitsOnly = trimmed.replace(/[.,]/g, '');
  return 'Rp' + digitsOnly.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}

function render(html){
  resultZone.innerHTML = `<div class="result-box hidden-init">${html}</div>`;
  requestAnimationFrame(() => {
    const box = resultZone.querySelector('.result-box');
    if (box) { box.style.transition = 'opacity .2s ease'; box.style.opacity = '1'; }
  });
}

function renderLoading(){
  render(`
    <div class="r-loading">
      <div class="r-skel thumb"></div>
      <div class="r-skel-lines">
        <div class="r-skel line w70"></div>
        <div class="r-skel line w45"></div>
        <div class="r-skel line w90"></div>
      </div>
    </div>`);
}

function renderProduct(p){
  render(`
    <div class="r-found">
      <img src="${p.img}" alt="${p.name}" onerror="this.style.display='none'">
      <div>
        <div class="r-name">${p.name}</div>
        ${p.price ? `<div class="r-price">${formatPrice(p.price)}</div>` : ''}
        <p class="r-desc">${p.desc || ''}</p>
        <a class="r-buy" href="${p.link}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h15l-1.5 9h-12z"/><circle cx="9.5" cy="20" r="1"/><circle cx="17.5" cy="20" r="1"/><path d="M6 6 4.5 3H2"/></svg>
          Beli di Shopee
        </a>
      </div>
    </div>`);
}

function renderNotFound(code){
  render(`
    <div class="r-empty">
      <strong>Kode "${code}" belum ketemu</strong>
      <span>Cek lagi penulisannya, atau tunggu postingan terbaru buat kode yang masih aktif.</span>
    </div>`);
}

function renderError(){
  render(`
    <div class="r-error">
      <strong>Gagal memuat</strong>
      <span>Koneksi atau server sedang bermasalah. Coba lagi sebentar.</span>
    </div>`);
}

async function handleSearch(){
  const code = codeInput.value.trim().toUpperCase();
  if (!code) { codeInput.focus(); return; }
  searchBtn.disabled = true;
  renderLoading();
  try {
    const snap = await getDoc(doc(db, COLLECTION, code));
    if (snap.exists()) renderProduct(snap.data());
    else renderNotFound(code);
  } catch (e) {
    renderError();
  }
  searchBtn.disabled = false;
}
</script>

</body>
</html>
